<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The faceted-gem brand mark from the play top bar (src/play.jsx), on the
       obsidian theme's dark plaque so it reads on light and dark tab bars.
       Colors are hardcoded: favicons can't see the app's CSS variables. -->
  <rect x="1" y="1" width="98" height="98" rx="14" fill="#08080a" stroke="#b08a48" stroke-width="2"/>
  <g fill="none" stroke="#c89e5c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"
     transform="translate(50 50) scale(0.72) translate(-50 -50)">
    <polygon points="50,4 91,28 91,72 50,96 9,72 9,28"/>
    <polygon points="50,4 73,40 50,60 27,40"/>
    <path d="M9,28 L27,40 M91,28 L73,40 M50,60 L50,96 M27,40 L9,72 M73,40 L91,72 M27,40 L50,96 M73,40 L50,96"/>
  </g>
</svg>
